
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Textract</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 30px 15px;
        }

        .contenedor {
            background: white;
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 12px #00000020;
        }

        h1 {
            color: #2563eb;
            text-align: center;
            font-size: 26px;
        }

        p {
            color: #666;
            text-align: center;
        }

        form {
            margin-top: 25px;
        }

        label {
            display: block;
            margin-bottom: 12px;
            font-weight: bold;
        }

        input[type="file"] {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .resultados {
            margin-top: 25px;
        }

        h3 {
            color: #333;
        }

        ul {
            padding: 0;
            list-style: none;
        }

        li {
            background: #dcfce7;
            color: #166534;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            overflow-wrap: anywhere;
        }

        .nota {
            font-size: 12px;
            color: #777;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>AWS Textract</h1>

        <p>Analizador de documentos PDF</p>

        <form id="uploadForm">

            <label for="documento">
                Seleccione archivo PDF
            </label>

            <input
                type="file"
                id="documento"
                name="documento"
                accept=".pdf,application/pdf"
                required
            >

            <button type="submit">Analizar PDF</button>

        </form>

        <div class="resultados">

            <h3>Resultados del análisis</h3>

            <ul id="listaResultados"></ul>

        </div>

    
    <script>

        const form = document.getElementById("uploadForm");
        const lista = document.getElementById("listaResultados");

        form.addEventListener("submit", async (e) => {

            e.preventDefault();

            const archivo =
                document.getElementById("documento").files[0];

            if (!archivo) {
                lista.textContent = "Seleccione un archivo PDF";
                return;
            }

            if (archivo.type !== "application/pdf") {
                lista.textContent = "Solo se permiten archivos PDF";
                return;
            }

            if (archivo.size >= 5 * 1024 * 1024) {
                lista.textContent = "El PDF debe pesar menos de 5 MB";
                return;
            }

            const formData = new FormData(form);

            lista.textContent = "Analizando documento...";

            try {

                const response = await fetch("/api/analizar", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.details || data.error || "Error del servidor"
                    );
                }

                lista.innerHTML = "";

                if (data.success) {

                    data.textos.forEach(resultado => {

                        const li = document.createElement("li");

                        li.textContent =
                            `${resultado.texto} - Confianza: ${resultado.confianza}%`;

                        lista.appendChild(li);

                    });

                } else {

                    lista.textContent =
                        data.error || "Error al analizar el PDF";

                }

            } catch (error) {

                console.error(error);

                lista.textContent = "Error: " + error.message;

            }

        });

    </script>

</body>
</html>
